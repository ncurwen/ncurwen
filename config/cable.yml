# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

# `async` rather than `test` so system tests exercise a real websocket: the
# `test` adapter only records broadcasts, so a broadcast refresh would never
# reach the browser and the live guest list couldn't be tested end to end.
# Tests that assert on broadcasts (ActionCable::TestHelper) swap in the test
# adapter themselves, so they're unaffected.
test:
  adapter: async

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
